name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configure AppArmor for unprivileged userns
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --workspace -- --nocapture
        env:
          SHADOW_REQUIRE_SANDBOX: "1"

      - name: Build shadow binary
        run: cargo build --verbose

      - name: Run Adversarial Security Suite
        run: |
          chmod +x tests/security/*.sh
          bash tests/security/test_adversarial_suite.sh

      - name: Run Transactional Apply & Rollback Tests
        run: bash tests/security/test_apply_rollback.sh

      - name: Run M1 E2E Proof of Concept
        run: bash tests/m1_e2e_demo.sh
