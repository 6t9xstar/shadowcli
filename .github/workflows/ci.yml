name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --workspace -- --nocapture
        env:
          SHADOW_REQUIRE_SANDBOX: "1"

      - name: Build shadow binary (Debug)
        run: cargo build --verbose

      - name: Build shadow binary (Release)
        run: cargo build --release --verbose

      - name: Detect & Validate AppArmor Capabilities
        run: |
          echo "=== Host AppArmor Capability Detection ==="
          if [ ! -d "/sys/kernel/security/apparmor" ]; then
            echo "ℹ [SKIPPED] AppArmor securityfs not available on runner kernel (/sys/kernel/security/apparmor missing). Skipping AppArmor enforcement validation."
            exit 0
          fi

          echo "✔ Active AppArmor securityfs detected."
          if [ -f "/proc/sys/kernel/apparmor_restrict_unprivileged_userns" ]; then
            STATUS=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)
            echo "✔ Ubuntu unprivileged userns restriction setting: $STATUS"
          else
            echo "ℹ /proc/sys/kernel/apparmor_restrict_unprivileged_userns not present."
          fi

          echo "Installing and loading ShadowCLI AppArmor profile..."
          sudo bash scripts/setup_host_apparmor.sh

          echo "Asserting AppArmor profile enforcement in aa-status..."
          if ! sudo aa-status 2>/dev/null | grep -E "shadow.*enforce|shadow\s+\(enforce\)|/shadow\b"; then
            echo "✖ FAILED: ShadowCLI AppArmor profile was not loaded or not in enforce mode!" >&2
            sudo aa-status 2>/dev/null || true
            exit 1
          fi
          echo "✔ Verified: ShadowCLI AppArmor profile is actively loaded and enforced."

      - name: Cleanup AppArmor Profile
        if: always()
        run: |
          if [ -f "/etc/apparmor.d/shadow" ]; then
            sudo apparmor_parser -R /etc/apparmor.d/shadow 2>/dev/null || true
            sudo rm -f /etc/apparmor.d/shadow
            echo "✔ AppArmor profile cleanup completed."
          fi

      - name: Run Adversarial Security Suite
        run: |
          chmod +x tests/security/*.sh
          bash tests/security/test_adversarial_suite.sh

      - name: Run Git & OverlayFS Compatibility Suite
        run: bash tests/security/test_git_overlayfs.sh

      - name: Run Claude Code MCP Integration Suite
        run: bash tests/security/test_claude_integration.sh

      - name: Run Transactional Apply & Rollback Suite
        run: bash tests/security/test_apply_rollback.sh

      - name: Run Claude Code E2E Demo Walkthrough
        run: bash demos/claude_code_demo.sh
