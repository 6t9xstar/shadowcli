[workspace]
members = [
    "crates/shadow-core",
    "crates/shadow-sandbox",
    "crates/shadow-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["ShadowCLI Contributors"]
repository = "https://github.com/shadowcli/shadowcli"
homepage = "https://github.com/shadowcli/shadowcli"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
